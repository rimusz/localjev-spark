[project]
name = "localjev-spark"
version = "0.1.0"
description = "Local System One judgments plus a soft OpenAI chat proxy to NVIDIA DGX Spark"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Rimantas Mocevicius" }]
keywords = ["jev", "system-one", "spark", "openai", "laya"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
laya = ["laya"]

[project.scripts]
localjev-spark = "localjev_spark.__main__:main"

[project.urls]
Homepage = "https://github.com/rimusz/localjev-spark"
Repository = "https://github.com/rimusz/localjev-spark"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localjev_spark"]
